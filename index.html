<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratibha Smart Classes - Premium Education Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #ff0033;
            --dark-red: #990022;
            --black: #0a0a0a;
            --dark-gray: #1a1a1a;
            --light-gray: #2a2a2a;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --glow-red: rgba(255, 0, 51, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2d0a0a 100%);
            min-height: 100vh;
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* Animated Background Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-red);
            border-radius: 50%;
            opacity: 0.5;
            animation: float 15s infinite;
            box-shadow: 0 0 10px var(--glow-red);
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 51, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 0, 51, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(255, 0, 51, 0.4);
            border-color: rgba(255, 0, 51, 0.6);
        }

        /* Auth Container */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .auth-box {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fff 0%, #ff0033 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(255, 0, 51, 0.5)); }
            to { filter: drop-shadow(0 0 30px rgba(255, 0, 51, 0.8)); }
        }

        .logo p {
            color: var(--text-gray);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .form-group:focus-within label {
            color: var(--primary-red);
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 0, 51, 0.3);
            border-radius: 10px;
            color: var(--text-white);
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
            transform: scale(1.02);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 0, 51, 0.5);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            color: var(--text-gray);
        }

        .toggle-auth a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            cursor: pointer;
        }

        .toggle-auth a:hover {
            text-shadow: 0 0 10px var(--glow-red);
        }

        /* Dashboard Layout */
        .dashboard {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(10, 10, 10, 0.95);
            border-right: 2px solid rgba(255, 0, 51, 0.3);
            padding: 30px 20px;
            overflow-y: auto;
            z-index: 100;
            transition: all 0.3s;
        }

        .sidebar-header {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 0, 51, 0.3);
            margin-bottom: 30px;
        }

        .sidebar-header h2 {
            background: linear-gradient(135deg, #fff 0%, #ff0033 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }

        .nav-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-gray);
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 0, 51, 0.2);
            color: var(--text-white);
            transform: translateX(10px);
            border-left: 3px solid var(--primary-red);
        }

        .main-content {
            margin-left: 280px;
            padding: 40px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 0, 51, 0.3);
        }

        .header h1 {
            font-size: 2rem;
            animation: slideInLeft 0.5s ease-out;
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 0, 51, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255, 0, 51, 0); }
        }

        .logout-btn {
            padding: 10px 20px;
            background: rgba(255, 0, 51, 0.2);
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: var(--primary-red);
            color: white;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .info-card {
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 0, 51, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .info-card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .card-title {
            font-size: 1.2rem;
            color: var(--text-gray);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fff 0%, #ff0033 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Fee Status */
        .fee-status {
            padding: 30px;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status-paid {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            border: 1px solid #00ff00;
        }

        .status-pending {
            background: rgba(255, 0, 51, 0.2);
            color: var(--primary-red);
            border: 1px solid var(--primary-red);
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid rgba(255, 0, 51, 0.3);
        }

        .gallery-item:hover {
            transform: scale(1.05);
            border-color: var(--primary-red);
            box-shadow: 0 10px 30px rgba(255, 0, 51, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* Quote Section */
        .quote-section {
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .quote-text {
            font-size: 1.5rem;
            font-style: italic;
            line-height: 1.6;
            color: var(--text-white);
            position: relative;
            z-index: 1;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quote-author {
            margin-top: 20px;
            color: var(--primary-red);
            font-weight: bold;
        }

        /* Faculty Grid */
        .faculty-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .faculty-card {
            text-align: center;
            padding: 25px;
            transition: all 0.3s;
        }

        .faculty-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .faculty-card:hover .faculty-img {
            transform: rotate(360deg);
            box-shadow: 0 0 30px var(--glow-red);
        }

        .faculty-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .faculty-subject {
            color: var(--primary-red);
            font-size: 0.9rem;
        }

        /* Fees Structure Table */
        .fees-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .fees-table th, .fees-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 0, 51, 0.3);
        }

        .fees-table th {
            background: rgba(255, 0, 51, 0.2);
            color: var(--primary-red);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fees-table tr:hover {
            background: rgba(255, 0, 51, 0.1);
            transition: background 0.3s;
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
        }

        .admin-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-btn {
            padding: 20px;
            background: rgba(255, 0, 51, 0.2);
            border: 2px solid var(--primary-red);
            border-radius: 15px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 1.1rem;
        }

        .admin-btn:hover {
            background: var(--primary-red);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 0, 51, 0.4);
        }

        .student-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 0, 51, 0.3);
            transition: all 0.3s;
        }

        .student-item:hover {
            background: rgba(255, 0, 51, 0.1);
            padding-left: 25px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 5px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .edit-btn {
            background: rgba(255, 165, 0, 0.3);
            color: orange;
        }

        .delete-btn {
            background: rgba(255, 0, 51, 0.3);
            color: var(--primary-red);
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            width: 90%;
            max-width: 500px;
            padding: 40px;
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: scale(0.8) translateY(-50px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--primary-red);
            transition: transform 0.3s;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading Animation */
        .loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
        }

        .loader-circle {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 0, 51, 0.3);
            border-top-color: var(--primary-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Section Transitions */
        .section {
            display: none;
            animation: sectionFade 0.5s ease-out;
        }

        .section.active {
            display: block;
        }

        @keyframes sectionFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Motivational Quote Animation */
        .motivation-card {
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .quote-icon {
            font-size: 4rem;
            color: var(--primary-red);
            opacity: 0.3;
            position: absolute;
            top: 10px;
            left: 20px;
        }

        /* Hidden Elements */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Particle Background -->
    <div class="particles" id="particles"></div>

    <!-- Loader -->
    <div class="loader" id="loader">
