<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratibha Classes</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
}

/* Navbar */
nav {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
}

nav h1 {
    color: #00eaff;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

/* Hero */
.hero {
    text-align: center;
    padding: 120px 20px;
    animation: fadeIn 2s ease;
}

.hero h2 {
    font-size: 40px;
}

.hero span {
    color: #00eaff;
}

.hero button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    background: #00eaff;
    color: black;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
}

.hero button:hover {
    transform: scale(1.1);
}

/* Courses */
.courses {
    padding: 50px 20px;
    text-align: center;
}

.course-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: rgba(255,255,255,0.08);
    margin: 15px;
    padding: 20px;
    width: 250px;
    border-radius: 15px;
    transition: 0.4s;
    opacity: 0;
    transform: translateY(50px);
}

.card.show {
    opacity: 1;
    transform: translateY(0);
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
}

/* Footer */
footer {
    text-align: center;
    padding: 20px;
    margin-top: 30px;
    background: rgba(0,0,0,0.3);
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
</head>

<body>

<nav>
    <h1>Pratibha Classes</h1>
    <div>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </div>
</nav>

<section class="hero">
    <h2>Build Your Future with <span>Pratibha Classes</span></h2>
    <p>Best coaching for school students</p>
    <button onclick="contact()">Join Now</button>
</section>

<section class="courses">
    <h2>Our Courses</h2>
    <div class="course-container">
        <div class="card">Class 10 - All Subjects</div>
        <div class="card">Class 11 - Science/Commerce</div>
        <div class="card">Class 12 - Board Prep</div>
    </div>
</section>

<footer>
    <p>© 2026 Pratibha Classes</p>
</footer>

<script>
function contact(){
    window.open("https://wa.me/91XXXXXXXXXX", "_blank");
}

// Scroll animation
const cards = document.querySelectorAll('.card');
window.addEventListener('scroll', () => {
    cards.forEach(card => {
        const top = card.getBoundingClientRect().top;
        if(top < window.innerHeight - 50){
            card.classList.add('show');
        }
    });
});
</script>

</body>
</html>
